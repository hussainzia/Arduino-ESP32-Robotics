name: New project idea
description: Suggest a project you would like to see in this collection
labels: [enhancement]
body:
  - type: input
    id: title
    attributes:
      label: Project name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: parts
    attributes:
      label: Main parts / sensors
